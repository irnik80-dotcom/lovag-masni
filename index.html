<!DOCTYPE html>
<html lang="hu">
<head>

<style>
html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}

.grp.l{left:12px}.grp.r{right:12px}
.btn{pointer-events:auto;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.35);color:#fff;font:bold 20px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;box-sizing:border-box}
.btn.on{background:rgba(255,255,255,.42)}
.l .btn{border-color:rgba(120,160,255,.75)}.r .btn{border-color:rgba(255,120,170,.8)}
#duo,#solo,.top{display:none}
#pad{pointer-events:auto;position:absolute;left:16px;bottom:16px;width:190px;height:96px;border-radius:48px;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);touch-action:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-sizing:border-box;color:rgba(255,255,255,.6);font:bold 24px sans-serif}
#knob{position:absolute;left:67px;top:20px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;transition:left .05s}
.sgrp{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:64px 64px;grid-template-rows:64px 84px;gap:10px}
.btn.sb{width:64px;height:64px;font-size:24px;border-color:rgba(255,205,117,.8)}
.btn.big{width:138px;height:84px;border-radius:42px;font-size:32px;border-color:rgba(167,240,112,.9)}
.top{position:absolute;top:8px;right:8px;gap:8px}
.top .btn{width:40px;height:40px;font-size:16px}
</style>
</head>

<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<div id="touch">
 <div id="duo">
  <div class="grp l">
    <div class="btn" data-p="0" data-k="anchor" style="grid-column:1;grid-row:1">⚓</div>
    <div class="btn" data-p="0" data-k="act" style="grid-column:2;grid-row:1">⚔</div>

 </div>

 </div>

<script>
'use strict';
/* ===================== ALAPOK ===================== */
const VW=480,VH=272,TS=16;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=3;
function resize(){
  const sc=Math.min(innerWidth/VW,innerHeight/VH);
  cv.style.width=Math.floor(VW*sc)+'px';cv.style.height=Math.floor(VH*sc)+'px';
  S=Math.max(1,Math.min(5,Math.ceil(sc*(window.devicePixelRatio||1))));
  cv.width=VW*S;cv.height=VH*S;ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const hsh=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const FONT='"Courier New",Courier,monospace';
function txt(s,x,y,o={}){
  const sz=o.sz||8;ctx.font=`bold ${sz}px ${o.font||FONT}`;ctx.textAlign=o.al||'left';ctx.textBaseline='top';
  if(o.sh!==null){ctx.fillStyle=o.sh||'#1a1c2c';ctx.fillText(s,x+1,y+1)}
  ctx.fillStyle=o.c||'#f4f4f4';ctx.fillText(s,x,y);
}
function wrap(s,maxW,sz=8){
  ctx.font=`bold ${sz}px ${FONT}`;const out=[];
  for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line)}
  return out;
}

/* ===================== HANG: Amiga/C64 stílusú 4 csatornás chiptune ===================== */
const AU={C:null,on:true,
  init(){
    if(this.C){if(this.C.state==='suspended'&&!game.paused)this.C.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const C=this.C=new AC();
    this.master=C.createGain();this.master.gain.value=this.on?.55:0;this.master.connect(C.destination);
    this.mus=C.createGain();this.mus.gain.value=.55;
    const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;this.mus.connect(lp);lp.connect(this.master);
    this.sfx=C.createGain();this.sfx.gain.value=.6;this.sfx.connect(this.master);
    const pan=v=>{let n;if(C.createStereoPanner){n=C.createStereoPanner();n.pan.value=v}else n=C.createGain();n.connect(this.mus);return n};
    // Amiga-szerű kemény sztereó: két csatorna balra, kettő jobbra
    this.chLead=pan(-.55);this.chArp=pan(.55);this.chDrum=pan(-.35);
    const bl=C.createBiquadFilter();bl.type='lowpass';bl.frequency.value=1100;bl.connect(pan(.45));this.chBass=bl;
    const nb=C.createBuffer(1,C.sampleRate,C.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=nb;
    const pw=duty=>{const N=48,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(Math.PI*k*duty);return C.createPeriodicWave(re,im)};
    this.p12=pw(.125);this.p25=pw(.25);this.p50=pw(.5);
    if(game.state==='title'&&!MUS.timer)MUS.play('A',-5,128);
  },
  get t(){return this.C?this.C.currentTime:0},
  tone(t,{f=440,dur=.1,wave='square',vol=.1,dest=null,slide=0,arp=null,vib=0,att=.004,rel=.04,dec=0}={}){
    const C=this.C;if(!C)return;
    const o=C.createOscillator(),g=C.createGain();
    if(typeof wave==='string')o.type=wave;else o.setPeriodicWave(wave);
    o.frequency.setValueAtTime(arp?arp[0]:f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    if(arp){let k=0;for(let tt=t;tt<t+dur;tt+=.021,k++)o.frequency.setValueAtTime(arp[k%arp.length],tt)}
    if(vib&&dur>.25){const l=C.createOscillator(),lg=C.createGain();l.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(0,t+.12);lg.gain.linearRampToValueAtTime(f*vib,t+.3);l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05)}
    const end=t+dur,useDec=dec&&dur>.25,sv=useDec?vol*dec:vol;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);
    if(useDec)g.gain.linearRampToValueAtTime(sv,t+att+.08);
    g.gain.setValueAtTime(sv,Math.max(t+att+.09,end-rel));g.gain.linearRampToValueAtTime(.0001,end);
    o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(end+.03);
  },
  noise(t,{dur=.1,vol=.2,type='highpass',freq=5000,q=.7,dest=null,sweep=0}={}){
    const C=this.C;if(!C)return;
    const s=C.createBufferSource();s.buffer=this.nb;const fl=C.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(freq,t);
    if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,t+dur);fl.Q.value=q;
    const g=C.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(dest||this.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.03);
  },
  kick(t,d){const C=this.C,o=C.createOscillator(),g=C.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(d);o.start(t);o.stop(t+.22)},
  snare(t,d){this.noise(t,{dur:.14,vol:.22,type:'bandpass',freq:1900,q:.8,dest:d});this.tone(t,{f:190,slide:120,dur:.07,wave:'triangle',vol:.14,dest:d})},
  hat(t,d){this.noise(t,{dur:.035,vol:.06,freq:7500,dest:d})},
  play(name){
    if(game.mode==='host'){G.fx.push([++G.fxId,name]);if(G.fx.length>10)G.fx.shift()}
    if(!this.C)return;const t=this.t+.005,A=this;
    switch(name){
      case 'jumpK':A.tone(t,{f:180,slide:420,dur:.14,wave:A.p50,vol:.09});break;
      case 'jumpC':A.tone(t,{f:500,slide:1100,dur:.1,wave:A.p25,vol:.07});break;
      case 'dbl':A.tone(t,{f:800,slide:1700,dur:.1,wave:A.p12,vol:.07});break;
      case 'rope':A.tone(t,{f:300,slide:700,dur:.12,wave:'triangle',vol:.16});break;
      case 'coin':A.tone(t,{f:988,dur:.06,wave:A.p50,vol:.07});A.tone(t+.06,{f:1319,dur:.22,wave:A.p50,vol:.07,rel:.15});break;
      case 'stomp':A.tone(t,{f:400,slide:90,dur:.13,wave:'square',vol:.1});A.noise(t,{dur:.08,vol:.12,type:'lowpass',freq:2000});break;
      case 'break':A.noise(t,{dur:.3,vol:.35,type:'lowpass',freq:2500,sweep:300});A.tone(t,{f:120,slide:50,dur:.15,wave:'square',vol:.08});break;
      case 'bump':A.tone(t,{f:140,slide:90,dur:.07,wave:'square',vol:.08});break;
      case 'sword':A.noise(t,{dur:.13,vol:.18,type:'bandpass',freq:1500,sweep:6000,q:2});break;
      case 'anchor':A.tone(t,{f:120,slide:60,dur:.14,wave:'triangle',vol:.25});A.noise(t,{dur:.06,vol:.08,type:'lowpass',freq:900});break;
      case 'lever':A.tone(t,{f:900,dur:.03,wave:'square',vol:.07});A.tone(t+.05,{f:600,dur:.05,wave:'square',vol:.07});break;
      case 'door':A.noise(t,{dur:.6,vol:.3,type:'lowpass',freq:600,sweep:120});[523,659,784,1047].forEach((f,i)=>A.tone(t+.1+i*.07,{f,dur:.1,wave:A.p25,vol:.06}));break;
      case 'cp':[659,784,988].forEach((f,i)=>A.tone(t+i*.06,{f,dur:.1,wave:A.p25,vol:.07}));break;
      case 'die':A.tone(t,{f:700,slide:90,dur:.55,wave:A.p25,vol:.1});A.noise(t,{dur:.3,vol:.1,type:'lowpass',freq:1500});break;
      case 'meow':{const C=A.C,o=C.createOscillator(),g=C.createGain(),fl=C.createBiquadFilter();o.type='sawtooth';fl.type='bandpass';fl.Q.value=3;
        fl.frequency.setValueAtTime(900,t);fl.frequency.linearRampToValueAtTime(1800,t+.15);fl.frequency.linearRampToValueAtTime(700,t+.45);
        o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(780,t+.15);o.frequency.linearRampToValueAtTime(480,t+.45);
        g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.25,t+.05);g.gain.linearRampToValueAtTime(.18,t+.3);g.gain.linearRampToValueAtTime(.0001,t+.48);
        o.connect(fl);fl.connect(g);g.connect(A.sfx);o.start(t);o.stop(t+.5);break}
      case 'win':{const n=[72,76,79,84,79,84,88];n.forEach((m,i)=>A.tone(t+i*.11,{f:mtof(m),dur:i===n.length-1?.7:.1,wave:A.p25,vol:.1,dest:A.mus}));
        [60,64,67].forEach(m=>A.tone(t+.66,{f:mtof(m),dur:.8,wave:A.p50,vol:.04,dest:A.mus}));break}
    }
  },
  toggle(){this.on=!this.on;if(this.master)this.master.gain.value=this.on?.55:0}
};

const SONGS={
  A:{bpm:140,chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],bass:[45,41,48,43],
    lead:'A4 - C5 - E5 - A5 - G5 - E5 - C5 - D5 - '+
         'C5 - - - A4 - C5 - F5 - E5 - C5 - A4 - '+
         'G4 - C5 - E5 - G5 - - - E5 - G5 - C6 - '+
         'B5 - - - A5 - G5 - D5 - - - B4 - D5 - '+
         'E5 - E5 . A5 - E5 - C6 - B5 - A5 - E5 - '+
         'F5 - - - E5 - C5 - A5 - - - G5 - F5 - '+
         'E5 - - - G5 - C6 - E6 - D6 - C6 - G5 - '+
         'D6 - - - - - - - B5 - G5 - A5 - B5 -',
    drums:'K.h.S.hKK.h.S.hh',bassPat:'R.RoR.RoR.RoR.Ro'},
  B:{bpm:118,chords:[[62,65,69],[58,62,65],[60,64,67],[57,61,64]],bass:[38,46,48,45],
    lead:'D5 - F5 - A5 - D6 - C6 - A5 - F5 - A5 - '+
         'A#5 - - - F5 - D5 - F5 - A#5 - D6 - - - '+
         'C6 - - - G5 - E5 - G5 - C6 - E6 - D6 - '+
         'C#6 - - - - - A5 - E5 - - - C#5 - E5 - '+
         'D6 . D6 . A5 - D6 - F6 - E6 - D6 - A5 - '+
         'A#5 - - - A5 - G5 - F5 - G5 - A5 - A#5 - '+
         'C6 - - - E6 - G6 - E6 - C6 - G5 - E5 - '+
         'E5 - - - - - - - . . . . . . . .',
    drums:'K...S..hK.K.S..h',bassPat:'R..oR.R.R..oR.Ro'}
};
(function prep(){const nn={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  for(const s of Object.values(SONGS)){const tk=s.lead.trim().split(/\s+/);s.len=Math.ceil(tk.length/16)*16;s.map=[];
    for(let i=0;i<tk.length;i++){const m=/^([A-G])(#?)(\d)$/.exec(tk[i]);if(!m)continue;let L=1;while(i+L<tk.length&&tk[i+L]==='-')L++;
      s.map[i]={m:12*(+m[3]+1)+nn[m[1]]+(m[2]?1:0),len:L}}}})();

/* iPhone: hang feloldása érintésre, és a némító kapcsoló ellenére is szóljon */
function silentWavURL(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
let silentEl=null;
function unlockAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}
  AU.init();const C=AU.C;if(!C)return;
  if(C.state!=='running'&&!game.paused)C.resume().catch(()=>{});
  if(!AU.unlocked){try{const b=C.createBuffer(1,1,22050),s=C.createBufferSource();s.buffer=b;s.connect(C.destination);s.start(0)}catch(_){}
    try{silentEl=new Audio(silentWavURL());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=0.01;silentEl.play().catch(()=>{})}catch(_){}
    AU.unlocked=true}}
['touchstart','touchend','click','pointerup','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AU.C&&AU.C.state!=='running'&&!game.paused)AU.C.resume().catch(()=>{})});
const MUS={timer:null,song:null,step:0,next:0,tr:0,bpm:140,
  play(name,tr=0,bpm){if(!AU.C)return;this.stop();this.song=SONGS[name];this.tr=tr;this.bpm=bpm||this.song.bpm;this.step=0;this.next=AU.t+.08;this.timer=setInterval(()=>this.tick(),25)},
  stop(){if(this.timer)clearInterval(this.timer);this.timer=null},
  tick(){if(!AU.C||AU.C.state!=='running')return;const sd=60/this.bpm/4;
    if(this.next<AU.t-.2)this.next=AU.t+.02;
    while(this.next<AU.t+.15){this.sched(this.step,this.next,sd);this.next+=sd;this.step=(this.step+1)%this.song.len}},
  sched(step,t,sd){const s=this.song,bar=Math.floor(step/16),si=step%16,ch=s.chords[bar%s.chords.length],tr=this.tr;
    const ev=s.map[step];if(ev)AU.tone(t,{f:mtof(ev.m+tr),dur:ev.len*sd*.95,wave:AU.p25,vol:.11,dest:AU.chLead,vib:.012,dec:.75,rel:.05});
    if(si%2===0)AU.tone(t,{arp:ch.map(n=>mtof(n+12+tr)),dur:sd*1.9,wave:AU.p12,vol:.045,dest:AU.chArp,rel:.02});
    const bp=s.bassPat[si];if(bp!=='.'){const r=s.bass[bar%s.bass.length]+tr+(bp==='o'?12:0);AU.tone(t,{f:mtof(r),dur:sd*.9,wave:'sawtooth',vol:.14,dest:AU.chBass,rel:.03})}
    const d=s.drums[si];if(d==='K')AU.kick(t,AU.chDrum);else if(d==='S')AU.snare(t,AU.chDrum);else if(d==='h')AU.hat(t,AU.chDrum);
  }
};

/* ===================== BEMENET ===================== */
const keys=new Set(),jp=new Set();let tapped=false,tapPos=null;
const MAP=[{left:['KeyA'],right:['KeyD'],jump:['KeyW'],anchor:['KeyS'],act:['KeyF','KeyG','KeyE']},
           {left:['ArrowLeft'],right:['ArrowRight'],jump:['ArrowUp'],anchor:['ArrowDown'],act:['ShiftRight','Numpad0','KeyL','Slash','Enter']}];
addEventListener('keydown',e=>{if(!e.repeat)jp.add(e.code);keys.add(e.code);AU.init();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{AU.init();tapped=true;const r=cv.getBoundingClientRect();tapPos={x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};cv.focus()});
const touch=[{},{},{}]; // 0: lovag (közös), 1: cica (közös), 2: saját (online)
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}};
if(isTouch){document.getElementById('touch').style.display='block';
  document.querySelectorAll('.btn[data-k]').forEach(b=>{const p=+b.dataset.p,k=b.dataset.k;
    const on=e=>{e.preventDefault();AU.init();touch[p][k]=true;b.classList.add('on');buzz();try{b.setPointerCapture(e.pointerId)}catch(_){}};
    const off=e=>{touch[p][k]=false;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
  // csúsztatós irányítópad: nem kell felemelni az ujjat irányváltáshoz
  const pad=document.getElementById('pad'),knob=document.getElementById('knob');
  const padMove=e=>{const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2);touch[2].left=dx<-12;touch[2].right=dx>12;
    knob.style.left=(Math.max(-60,Math.min(60,dx))+r.width/2-26-2)+'px'};
  const padEnd=()=>{touch[2].left=touch[2].right=false;knob.style.left='67px'};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();try{pad.setPointerCapture(e.pointerId)}catch(_){}padMove(e)});
  pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')padMove(e)});

function mkNet(role,code,peer){const now=()=>Date.now();
  const N={pres:{},remote:{},conn:null,peer,mq:[],lastRx:0,lastP2P:0,lastSend:0,lastMq:0,dirty:false,timer:null,

    p2p(){return !!(N.conn&&N.conn.open)},
    presence(patch){for(const k in patch){if(patch[k]===null)delete N.pres[k];else N.pres[k]=patch[k]}N.flush();return Promise.resolve()},
    flush(){N.dirty=true;if(N.p2p()){try{N.conn.send(N.pres);N.dirty=false;N.lastSend=now()}catch(_){}}},
    mqSend(){const txt=JSON.stringify(N.pres);for(const c of N.mq)if(c.connected){try{c.publish(N.outT,txt,{qos:0})}catch(_){}}N.lastMq=N.lastSend=now();N.dirty=false},
    tick(){const t=now(),viaMq=!N.p2p()||t-N.lastP2P>3000;
      if(N.dirty&&viaMq&&t-N.lastMq>=66)N.mqSend();
      else if(t-N.lastSend>500){if(N.p2p())N.flush();if(viaMq)N.mqSend()}},
    rx(d,direct){if(d&&typeof d==='object'&&(d.r==='host'||d.r==='guest')){N.remote=d;N.lastRx=now();if(direct)N.lastP2P=now()}},
    peers(){const a=[{sameTab:true,presence:N.pres}];if((N.p2p()||now()-N.lastRx<5000)&&N.remote&&N.remote.r)a.push({sameTab:false,presence:N.remote});return a},
    status(){return N.p2p()&&now()-N.lastP2P<3000?'közvetlen':now()-N.lastRx<5000?'szerveren át':'kapcsolódás…'},
    anyUp(){return N.p2p()||N.mq.some(c=>c.connected)||!!(N.peer&&N.peer.open)},
    attach(c){if(N.conn&&N.conn.open&&N.conn!==c){try{c.close()}catch(_){}return}

    leave(){clearInterval(N.timer);try{N.conn&&N.conn.close()}catch(_){}try{N.peer&&N.peer.destroy()}catch(_){}
      for(const c of N.mq){try{c.end(true)}catch(_){}}N.mq=[];return Promise.resolve()}};
  if(typeof mqtt!=='undefined')for(const url of MQ_BROKERS){try{
    const c=mqtt.connect(url,{clientId:'lm_'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30});

/* ===================== JÁTÉK ÁLLAPOT ===================== */
const SOLID=new Set(['#','X','B','?','u','D']);
const KCFG={k:1,w:12,h:27,acc:.36,max:1.9,jump:5.6,jump2:0,inv:.45,gInv:.08};
const CCFG={k:0,w:11,h:10,acc:.45,max:2.4,jump:5.2,jump2:4.6,inv:1,gInv:.5};
const game={saveFlash:0,pendingResume:null,flash:'',flashT:0,codeIn:'',mode:'local',me:0,sel:0,msg:'',remoteWait:false,state:'title',lvl:0,coins:0,deaths:0,dying:0,clear:0,intro:0,paused:false,sign:null,endT:0};
let LV=null,PL=[],ents=[],parts=[],cam={x:0,y:0},T=0;
const rope={L:128,MAX:128,MIN:12};

function tile(x,y){if(x<0||x>=LV.w)return 'X';if(y<0||y>=LV.h)return ' ';return LV.g[y][x]}
function setT(x,y,c){if(x>=0&&y>=0&&x<LV.w&&y<LV.h){LV.g[y][x]=c;LV.mods[x+','+y]=c}}
function mkP(cfg){return{cfg,w:cfg.w,h:cfg.h,x:0,y:0,vx:0,vy:0,onG:false,face:1,anch:false,air:0,coy:0,buf:0,atk:0,anim:0,flag:false,onK:false,hang:false,climb:false,bub:0,pop:0,dx:0,dy:0}}

function startLevel(i){
  const d=LEVELS[i],b=new Builder(d.w,24);d.build(b);
  LV={name:d.name,sub:d.sub||'Lovag & Masni – együtt, előre!',hotel:b.hotel||0,theme:d.theme,w:b.w,h:b.h,g:b.g,signs:b.signs,flag:b.flag,castle:b.castle,cp:{...b.sp},bumps:{},mods:{}};
  ents=b.ents.map(e=>Object.assign(e,{x0:e.x,y0:e.y,vx0:e.vx,vy:0,alive:true,t:Math.random()*100,dt:0,onG:false}));
  PL=[mkP(KCFG),mkP(CCFG)];PL[1].face=-1;placePlayers();parts=[];
  const mx=(PL[0].x+PL[1].x)/2;cam.x=Math.max(0,Math.min(LV.w*TS-VW,mx-VW/2));cam.y=Math.max(0,Math.min(LV.h*TS-VH,PL[0].y-VH*.55));
  game.dying=0;game.clear=0;game.intro=160;game.state='play';
  MUS.play(d.song,d.tr,d.bpm);
}
function placePlayers(){const cp=LV.cp,K=PL[0],C=PL[1];
  K.x=cp.x;K.y=cp.top-K.h;C.x=cp.x+16;C.y=cp.top-C.h;
  for(const p of PL){p.vx=p.vy=0;p.anch=false;p.onK=false;p.atk=0;p.flag=false;p.hang=p.climb=false;p.onG=true}
  rope.L=rope.MAX}
function startGame(){game.coins=0;game.deaths=0;game.lvl=0;startLevel(0)}

/* ---------- ütközés ---------- */
function moveX(e,dx){const n=Math.max(1,Math.ceil(Math.abs(dx)/6)),s=dx/n;
  for(let i=0;i<n;i++){e.x+=s;const y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-.01)/TS);
    if(s>0){const tx=Math.floor((e.x+e.w-.01)/TS);for(let y=y0;y<=y1;y++)if(SOLID.has(tile(tx,y))){e.x=tx*TS-e.w;return true}}
    else if(s<0){const tx=Math.floor(e.x/TS);for(let y=y0;y<=y1;y++)if(SOLID.has(tile(tx,y))){e.x=(tx+1)*TS;return true}}}
  return false}
function moveY(e,dy){const n=Math.max(1,Math.ceil(Math.abs(dy)/6)),s=dy/n;
  for(let i=0;i<n;i++){const ob=e.y+e.h;e.y+=s;const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-.01)/TS);
    if(s>0){const ty=Math.floor((e.y+e.h-.01)/TS);for(let x=x0;x<=x1;x++){const c=tile(x,ty);if(SOLID.has(c)||(c==='='&&ob<=ty*TS+.01)){e.y=ty*TS-e.h;return 1}}}
    else if(s<0){const ty=Math.floor(e.y/TS),cx=Math.floor((e.x+e.w/2)/TS);for(const x of [cx,x0,x1]){if(x<x0||x>x1)continue;if(SOLID.has(tile(x,ty))){e.y=(ty+1)*TS;e.hit={x,y:ty};return -1}}}}
  return 0}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------- részecskék ---------- */
function puff(x,y,c,n,sp=1.2,g=.05){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*2*sp,vy:-Math.random()*sp,l:20+Math.random()*15,c,g,s:Math.random()<.5?1:2})}
function sparkle(x,y){puff(x,y,'#ffcd75',6,1,0);puff(x,y,'#f4f4f4',3,1,0)}
function coinPop(x,y){parts.push({x:x-3,y,vx:0,vy:-3.5,l:26,c:'coin',g:.2,s:6})}

/* ---------- interakciók ---------- */
function breakBrick(x,y,vis){if(!vis){setT(x,y,' ');AU.play('break')}for(let i=0;i<8;i++)parts.push({x:x*TS+8,y:y*TS+8,vx:(Math.random()-.5)*4,vy:-Math.random()*4-1,l:45,c:i%2?THEMES[LV.theme].brick:THEMES[LV.theme].mortar,g:.25,s:3})}
function headHit(p,x,y){const c=tile(x,y);
  if(c==='B'){if(p.cfg.k)breakBrick(x,y);else{LV.bumps[x+','+y]=8;AU.play('bump')}}
  else if(c==='?'){setT(x,y,'u');LV.bumps[x+','+y]=8;game.coins++;AU.play('coin');coinPop(x*TS+8,y*TS-6)}
  else AU.play('bump');
  for(const e of ents)if(e.alive&&e.k==='slime'&&Math.abs(e.x+7-(x*TS+8))<14&&Math.abs(e.y+e.h-y*TS)<3)kill(e)}
function kill(e){e.alive=false;e.dt=25;AU.play('stomp');puff(e.x+7,e.y+5,'#b55088',8,1.5,.1)}
function swordHit(p){const hb={x:p.face>0?p.x+p.w:p.x-20,y:p.y+4,w:20,h:p.h-6};
  for(const e of ents)if(e.alive&&ov(hb,e))kill(e);
  const x0=Math.floor(hb.x/TS),x1=Math.floor((hb.x+hb.w-.01)/TS),y0=Math.floor(hb.y/TS),y1=Math.floor((hb.y+hb.h-.01)/TS);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(tile(x,y)==='B')breakBrick(x,y)}
function openDoors(){AU.play('lever');setTimeout(()=>AU.play('door'),120);
  for(let y=0;y<LV.h;y++)for(let x=0;x<LV.w;x++)if(LV.g[y][x]==='D'){setT(x,y,' ');puff(x*TS+8,y*TS+8,'#b86f50',5,1.5,.1);puff(x*TS+8,y*TS+8,'#94b0c2',3,1.5,.1)}}
function touchTiles(p){const x0=Math.floor(p.x/TS),x1=Math.floor((p.x+p.w-.01)/TS),y0=Math.floor(p.y/TS),y1=Math.floor((p.y+p.h-.01)/TS);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=tile(x,y);
    if(c==='o'){setT(x,y,' ');game.coins++;AU.play('coin');sparkle(x*TS+8,y*TS+8)}
    else if(c==='^'){if(p.y+p.h>y*TS+9&&p.x+p.w>x*TS+2&&p.x<x*TS+14)die()}
    else if(c==='S'){setT(x,y,'Z');openDoors()}
    else if(c==='P'){setT(x,y,'Q');LV.cp={x:x*TS-8,top:(y+1)*TS};AU.play('cp');setTimeout(writeSave,0);puff(x*TS+12,y*TS+4,'#a7f070',10,1.5,0)}}}
function die(){if(game.dying||game.clear)return;game.dying=70;game.deaths++;AU.play('die');
  for(const p of PL){puff(p.x+p.w/2,p.y+p.h/2,'#ff77a8',10,2,.1);puff(p.x+p.w/2,p.y+p.h/2,'#f4f4f4',6,2,.1)}}
function autoCheckpoint(){const K=PL[0],C=PL[1];
  if(!K.onG||!C.onG||C.onK){LV.safeT=0;return}
  const minX=Math.min(K.x,C.x);if(minX<LV.cp.x+48){LV.safeT=0;return}
  const top=K.y+K.h;if(Math.abs(C.y+C.h-top)>.5||Math.abs(top/TS-Math.round(top/TS))>.01){LV.safeT=0;return}
  const ty=Math.round(top/TS),x=Math.floor(minX/TS)*TS;
  for(let px=x;px<x+28;px+=4){const tx=Math.floor(px/TS);if(!SOLID.has(tile(tx,ty))){LV.safeT=0;return}
    for(let r=1;r<=2;r++){const c=tile(tx,ty-r);if(SOLID.has(c)||c==='^'){LV.safeT=0;return}}}
  for(const e of ents)if(e.alive&&Math.abs(e.x-x)<72&&Math.abs(e.y-(ty*TS-16))<56){LV.safeT=0;return}
  if(++LV.safeT<40)return;
  LV.safeT=0;LV.cp={x,top:ty*TS};game.saveFlash=90;writeSave()}
function respawn(){placePlayers();for(const e of ents)if(e.alive){e.x=e.x0;e.y=e.y0;e.vx=e.vx0;e.vy=0}}

/* ---------- fonal ---------- */
function rv(){const a=PL[0],b=PL[1],dx=b.x+b.w/2-(a.x+a.w/2),dy=b.y+b.h/2-(a.y+a.h*.5);return{dx,dy,d:Math.hypot(dx,dy)}}
function ropeSolve(){const a=PL[0],b=PL[1],v=rv();if(v.d<=rope.L||v.d<.01)return;
  const wa=a.anch?0:(a.onG?a.cfg.gInv:a.cfg.inv),wb=b.anch?0:(b.onG?b.cfg.gInv:b.cfg.inv),s=wa+wb;if(s<=0)return;
  const nx=v.dx/v.d,ny=v.dy/v.d,ex=v.d-rope.L;
  if(wa){moveX(a,nx*ex*wa/s);moveY(a,ny*ex*wa/s)}
  if(wb){moveX(b,-nx*ex*wb/s);moveY(b,-ny*ex*wb/s)}
  const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(vr>0){a.vx+=nx*vr*wa/s;a.vy+=ny*vr*wa/s;b.vx-=nx*vr*wb/s;b.vy-=ny*vr*wb/s}}

/* ---------- játékos ---------- */
function updPlayer(p,I,o){const c=p.cfg;p.anim++;if(p.bub>0)p.bub--;
  if(p.onK){const K=PL[0];if(p.x+p.w>K.x+1&&p.x<K.x+K.w-1){moveX(p,K.dx);moveY(p,(K.y-p.h)-p.y);p.onG=true}else p.onK=false}
  const v=rv();
  const wantA=I.anchor&&p.onG;if(wantA&&!p.anch){AU.play('anchor');puff(p.x+p.w/2,p.y+p.h,'#94b0c2',4,.8,0)}p.anch=wantA;
  p.hang=!p.onG&&o.anch&&v.d>=rope.L-3;
  const dir=(I.right?1:0)-(I.left?1:0);
  if(p.anch)p.vx*=.5;
  else{if(dir){if(p.vx*dir<c.max)p.vx+=dir*c.acc*(p.onG?1:.6);p.face=dir}else p.vx*=p.onG?.7:.97;
    if(p.onG&&Math.abs(p.vx)>c.max)p.vx=Math.sign(p.vx)*c.max;
    if(!p.onG&&Math.abs(p.vx)>c.max)p.vx*=.99}
  if(I.jumpP)p.buf=8;else if(p.buf>0)p.buf--;
  if(p.onG){p.coy=6;p.air=c.jump2?1:0}else if(p.coy>0)p.coy--;
  if(p.buf>0&&!p.anch){
    if(p.coy>0){p.vy=-c.jump;p.coy=0;p.buf=0;p.onK=false;AU.play(c.k?'jumpK':'jumpC')}
    else if(p.hang){p.vy=-c.jump*.85;p.buf=0;AU.play('rope')}
    else if(p.air>0){p.vy=-c.jump2;p.air--;p.buf=0;AU.play('dbl');puff(p.x+p.w/2,p.y+p.h,'#f4f4f4',6)}}
  p.climb=!p.onG&&o.anch&&I.jump&&(p.hang||p.vy>-.6);
  if(p.climb){rope.L=Math.max(rope.MIN,Math.min(rope.L,v.d)-1.6);
    if(rope.L<=rope.MIN+.5&&p.pop<=0){p.vy=-4.8;p.vx=Math.sign((o.x+o.w/2)-(p.x+p.w/2))*2||p.face*2;rope.L=44;p.pop=25;AU.play('rope')}}
  if(p.pop>0)p.pop--;
  if(p.hang&&I.anchor)rope.L=Math.min(rope.MAX,rope.L+1.6);
  let g=.4;if(p.vy<0&&I.jump&&!p.climb)g=.24;
  p.vy=Math.min(p.vy+g,7);
  const wasG=p.onG;p.onG=false;
  if(moveX(p,p.vx))p.vx=0;
  const ob=p.y+p.h,r=moveY(p,p.vy);
  if(r===1){if(!wasG&&p.vy>3.5)puff(p.x+p.w/2,p.y+p.h,'#f4f4f4',4,.8,0);p.onG=true;p.vy=0;p.onK=false}
  else if(r===-1){headHit(p,p.hit.x,p.hit.y);p.vy=Math.max(p.vy,.5)}
  if(!c.k&&!p.onG&&p.vy>=0){const K=PL[0],nb=p.y+p.h;if(ob<=K.y+.5&&nb>=K.y&&p.x+p.w>K.x+1&&p.x<K.x+K.w-1){p.y=K.y-p.h;p.vy=0;p.onG=true;p.onK=true}}
  if(I.actP){if(c.k){if(p.atk<=0&&!p.anch){p.atk=16;AU.play('sword')}}else{p.bub=70;AU.play('meow')}}
  if(p.atk>0){p.atk--;if(p.atk>3&&p.atk<14)swordHit(p)}
  if(p.y>LV.h*TS+10)die();
}

/* ---------- ellenfelek ---------- */
function updEnts(){for(const e of ents){if(!e.alive){if(e.dt>0)e.dt--;continue}e.t++;
  if(e.k==='slime'){e.vy=Math.min(e.vy+.4,6);
    if(moveX(e,e.vx))e.vx=-e.vx;
    else if(e.onG){const fx=e.vx>0?e.x+e.w+1:e.x-1,c=tile(Math.floor(fx/TS),Math.floor((e.y+e.h+2)/TS));if(!SOLID.has(c)&&c!=='=')e.vx=-e.vx}
    const r=moveY(e,e.vy);e.onG=r===1;if(r)e.vy=0;if(e.y>LV.h*TS)e.alive=false}
  else{e.x+=e.vx;if(Math.abs(e.x-e.x0)>56){e.vx=-e.vx;e.x+=e.vx}e.y=e.y0+Math.sin(e.t*.05)*14}
  for(let i=0;i<2;i++){const p=PL[i];if(!e.alive)break;if(ov(p,e)){
    if(p.vy>.3&&p.y+p.h-p.vy<=e.y+6){kill(e);p.vy=IN[i].jump?-6:-4.5;p.air=p.cfg.jump2?1:0;p.onK=false}
    else{die();return}}}}}

/* ---------- lépés ---------- */
function togglePause(){game.paused=!game.paused;if(AU.C){game.paused?AU.C.suspend():AU.C.resume()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.state==='play'&&!game.paused&&game.mode==='local')togglePause()});
function updSign(){game.sign=null;for(const s of LV.signs)for(const p of PL)if(Math.abs(p.x+p.w/2-s.x)<30&&Math.abs(p.y+p.h/2-s.y)<40)game.sign=s.t}

function simStep(){
  if(['title','code','lobby','msg','joining'].includes(game.state)){menuStep();return}
  if(game.state==='end'){game.endT++;if(game.endT>60&&(menuNav().ok||tapped))toTitle();return}
  if(jp.has('KeyP')||jp.has('Escape')||IN[0].startP||IN[1].startP)togglePause();
  if(game.paused)return;
  if(game.mode==='host'){if(peerWith('guest'))G.waitT=0;else G.waitT++;if(G.waitT>60)return}
  if(game.intro>0)game.intro--;
  updParts();
  if(game.clear>0){game.clear--;for(const p of PL){p.anim++;if(p.onG&&game.clear%40===0)p.vy=-4;p.vy=Math.min(p.vy+.4,7);p.onG=moveY(p,p.vy)===1;if(p.onG)p.vy=0}
    if(game.clear===0){game.lvl++;if(game.lvl>=LEVELS.length){game.state='end';game.endT=0;clearSave();MUS.play('A',5,150)}else{startLevel(game.lvl);writeSave()}}return}
  if(game.dying>0){game.dying--;if(game.dying===0)respawn();return}
  const K=PL[0],C=PL[1],kx=K.x,ky=K.y;
  updPlayer(K,IN[0],C);K.dx=K.x-kx;K.dy=K.y-ky;
  updPlayer(C,IN[1],K);
  ropeSolve();ropeSolve();
  if((K.onG&&C.onG)||(!K.anch&&!C.anch))rope.L=Math.min(rope.MAX,rope.L+2.5);
  updEnts();
  if(game.dying)return;
  autoCheckpoint();if(T%300===0)writeSave();
  for(const p of PL){touchTiles(p);const f=LV.flag;
    if(f&&!p.flag&&p.x<f.x+3&&p.x+p.w>f.x-1&&p.y<f.bot&&p.y+p.h>f.top){p.flag=true;AU.play('cp');sparkle(f.x,p.y)}}
  if(K.flag&&C.flag&&!game.clear){game.clear=230;MUS.stop();AU.play('win')}
  for(const k in LV.bumps){if(--LV.bumps[k]<=0)delete LV.bumps[k]}
  updSign();updCam();
}

  case '=':if(LV.theme==='sky'){R(x,y+1,16,5,'#f4f4f4');R(x+2,y,5,1,'#f4f4f4');R(x+9,y,5,1,'#f4f4f4');R(x,y+6,16,1,'#94b0c2')}
    else{R(x,y,16,5,'#b86f50');R(x,y,16,1,'#e4a672');R(x,y+4,16,1,'#743f39');R(x+3,y+5,2,3,'#743f39');R(x+11,y+5,2,3,'#743f39');R(x+7,y+1,1,3,'#743f39')}break;
  case 'D':R(x,y,16,16,'#743f39');for(const a of [1,5,9,13])R(x+a,y,a===13?2:3,16,'#8a4b2e');R(x,y+3,16,2,'#566c86');R(x,y+11,16,2,'#566c86');R(x+2,y+3,1,1,'#94b0c2');R(x+13,y+11,1,1,'#94b0c2');R(x+7,y+6,2,3,'#ffcd75');break;
  case '^':for(let k=0;k<4;k++){const a=x+k*4;R(a+1,y+9,2,1,'#f4f4f4');R(a+1,y+10,2,2,'#94b0c2');R(a,y+12,4,4,'#94b0c2');R(a+2,y+12,2,4,'#566c86')}break;
  case 'S':case 'Z':{const on=c==='Z';R(x+3,y+13,10,3,'#566c86');R(x+3,y+13,10,1,'#94b0c2');
    if(!on){R(x+8,y+11,1,2,'#743f39');R(x+7,y+9,1,2,'#743f39');R(x+6,y+7,1,2,'#743f39');R(x+4,y+5,3,3,'#b13e53')}
    else{R(x+7,y+11,1,2,'#743f39');R(x+8,y+9,1,2,'#743f39');R(x+9,y+7,1,2,'#743f39');R(x+9,y+5,3,3,'#38b764')}break}
  case 'P':case 'Q':R(x+7,y+1,2,15,'#94b0c2');R(x+7,y+1,1,15,'#f4f4f4');R(x+9,y+1,6,5,c==='Q'?'#a7f070':'#566c86');if(c==='Q')R(x+9,y+1,6,1,'#f4f4f4');R(x+5,y+14,6,2,'#566c86');break;
  case 'i':R(x+7,y+8,2,8,'#743f39');R(x+1,y+1,14,8,'#743f39');R(x+2,y+2,12,6,'#b86f50');R(x+4,y+3,8,1,'#743f39');R(x+4,y+5,6,1,'#743f39');break;
  case 'o':if(LV.theme==='night'){const p=(T>>4)%2;R(x+3-p,y+4-p,2,1,'#ff77a8');R(x+9,y+4-p,2+p,1,'#ff77a8');R(x+2-p,y+5-p,11+2*p,3,'#ff77a8');R(x+3,y+8,9,2,'#ff77a8');R(x+5,y+10,5,2,'#ff77a8');R(x+7,y+12,1,1,'#ff77a8');R(x+4,y+5,2,2,'#ffc0d8');break}
  {const f=Math.floor((T+tx*7)/8)%4,w=[8,6,2,6][f],ax=x+8-w/2;R(ax,y+4,w,9,'#b86f50');R(ax+(w>2?1:0),y+5,Math.max(1,w-2),7,'#ffcd75');if(w>4)R(ax+1,y+5,1,3,'#fff6d0');break}
  }}
function drawFlag(ox,oy){const f=LV.flag;if(!f)return;const x=f.x-ox,y0=f.top-oy,y1=f.bot-oy;
  R(x-3,y1-3,8,3,'#566c86');R(x,y0,2,y1-y0,'#f4f4f4');R(x+1,y0,1,y1-y0,'#94b0c2');R(x-1,y0-4,4,4,'#ffcd75');
  const done=PL[0].flag&&PL[1].flag,col=done?'#a7f070':'#ff77a8';
  for(let r=0;r<9;r++){const w=Math.round(14*(1-Math.abs(r-4)/5)),o=Math.round(Math.sin(T*.12-r*.4));R(x+2,y0+2+r+o,w,1,col)}
  if(PL[0].flag)R(x-4,y1-10,3,3,'#3b5dc9');if(PL[1].flag)R(x+3,y1-10,3,3,'#ff77a8')}
function drawEnt(e,ox,oy){const x=Math.round(e.x)-ox,y=Math.round(e.y)-oy;
  if(e.k==='slime'){if(!e.alive){if(e.dt>0){R(x,y+7,14,3,'#5d275d');R(x+2,y+6,10,1,'#b55088')}return}
    const s=Math.sin(e.t*.15)>0?1:0,ex=e.vx<0?0:2;
    R(x+1,y+3+s,12,7-s,'#5d275d');R(x+3,y+1+s,8,2,'#5d275d');R(x+2,y+2+s,10,2,'#5d275d');R(x+3,y+2+s,6,1,'#b55088');R(x+2,y+3+s,2,2,'#b55088');
    R(x+2+ex,y+4+s,3,3,'#f4f4f4');R(x+7+ex,y+4+s,3,3,'#f4f4f4');R(x+3+ex+(e.vx<0?-1:1),y+5+s,1,2,'#1a1c2c');R(x+8+ex+(e.vx<0?-1:1),y+5+s,1,2,'#1a1c2c');R(x+1,y+9,12,1,'#3a1a3a')}
  else{if(!e.alive){if(e.dt>0)R(x+5,y+2+(25-e.dt),4,4,'#333c57');return}
    const up=Math.floor(e.t/6)%2;R(x+5,y+2,4,4,'#333c57');R(x+5,y+1,1,1,'#333c57');R(x+8,y+1,1,1,'#333c57');
    if(up){R(x,y,5,2,'#5d275d');R(x+1,y+2,4,1,'#5d275d');R(x+9,y,5,2,'#5d275d');R(x+9,y+2,4,1,'#5d275d')}
    else{R(x,y+3,5,2,'#5d275d');R(x+1,y+5,3,1,'#5d275d');R(x+9,y+3,5,2,'#5d275d');R(x+10,y+5,3,1,'#5d275d')}
    R(x+6,y+3,1,1,'#ff5577');R(x+8,y+3,1,1,'#ff5577')}}
function drawCoinIcon(x,y){R(x,y,6,8,'#b86f50');R(x+1,y+1,4,6,'#ffcd75');R(x+1,y+1,1,3,'#fff6d0')}

function renderPlay(){const Th=THEMES[LV.theme],ox=Math.round(cam.x),oy=Math.round(cam.y);
  drawSky(Th,ox,oy);drawCastle(ox,oy);
  const tx0=Math.floor(ox/TS),ty0=Math.floor(oy/TS);
  for(let ty=Math.max(0,ty0);ty<=Math.min(LV.h-1,ty0+17);ty++)for(let tx=Math.max(0,tx0);tx<=Math.min(LV.w-1,tx0+30);tx++){
    const c=LV.g[ty][tx];if(c===' ')continue;const bk=LV.bumps[tx+','+ty],bo=bk?-Math.round(Math.sin(bk/8*Math.PI)*3):0;
    drawTile(c,tx,ty,tx*TS-ox,ty*TS-oy+bo,Th)}
  drawFlag(ox,oy);
  for(const e of ents)drawEnt(e,ox,oy);
  const blink=game.dying&&((T>>2)&1);
  if(!blink){const r=ropePts();drawRopeAt(r.ax-ox,r.ay-oy,r.bx-ox,r.by-oy,rope.L);drawKnight(PL[0],ox,oy);drawCat(PL[1],ox,oy)}
  const K=PL[0];if(K.atk>8&&!blink){const sx=(K.face>0?K.x+K.w+4:K.x-14)-ox,sy=K.y+6-oy,ph=16-K.atk;for(let i=0;i<5;i++){const a=(-.9+i*.45)*(K.face>0?1:-1);R(Math.round(sx+5+Math.cos(a)*10*(K.face>0?1:-1)),Math.round(sy+8+Math.sin(a)*10)+ph-3,2,1,i%2?'#f4f4f4':'#73eff7')}}
  for(const q of parts){if(q.c==='coin'){drawCoinIcon(Math.round(q.x)-ox,Math.round(q.y)-oy);continue}R(Math.round(q.x)-ox,Math.round(q.y)-oy,q.s,q.s,q.c)}
  // HUD
  R(0,0,VW,13,'rgba(26,28,44,.7)');drawCoinIcon(5,3);txt('× '+game.coins,14,2,{c:'#ffcd75'});
  txt(LV.name,VW/2,2,{al:'center',c:'#f4f4f4'});txt('Elesések: '+game.deaths+(AU.on?'':'  ♪ki'),VW-5,2,{al:'right',c:'#94b0c2'});
  if(game.sign){const L=wrap(game.sign,330),w=344,h=L.length*10+10,x=(VW-w)/2,y=20;R(x,y,w,h,'rgba(26,28,44,.85)');R(x,y,w,1,'#ffcd75');R(x,y+h-1,w,1,'#ffcd75');L.forEach((l,i)=>txt(l,x+7,y+5+i*10,{c:'#f4f4f4'}))}
  if(game.intro>0&&!game.sign&&!game.dying){const a=Math.min(1,game.intro/30);ctx.globalAlpha=a;R(VW/2-120,92,240,46,'rgba(26,28,44,.85)');R(VW/2-120,92,240,2,'#ff77a8');
    txt(LV.name,VW/2,100,{al:'center',sz:16,c:'#ffcd75'});txt(LV.sub,VW/2,122,{al:'center',c:'#f4f4f4'});ctx.globalAlpha=1}
  if(game.dying)txt('Jaj! Még egyszer, együtt!',VW/2,110,{al:'center',sz:14,c:'#ff77a8'});
  if(game.clear){const cols=['#ffcd75','#ff77a8','#73eff7','#a7f070'];txt('PÁLYA TELJESÍTVE!',VW/2,96,{al:'center',sz:22,c:cols[(T>>3)%4]});txt('Érmék: '+game.coins,VW/2,124,{al:'center',sz:10})}
  if(game.saveFlash>0){game.saveFlash--;txt('✓ Mentési pont',VW-5,15,{al:'right',c:'#a7f070',sz:7})}
  if(game.mode!=='local'){txt('Online · szoba '+roomCode+' · te: '+(game.me===0?'Lovag':'Masni')+' · kapcsolat: '+(NR?NR.status():'-'),5,15,{c:'#a7f070',sz:7})}
  if((game.mode==='host'&&G.waitT>60)||(game.mode==='guest'&&game.remoteWait)){R(0,0,VW,VH,'rgba(10,10,20,.65)');txt('Várakozás a társra…',VW/2,104,{al:'center',sz:16,c:'#ffcd75'});txt('Szoba: '+roomCode+' – a társ a szobakóddal tud visszajönni.',VW/2,128,{al:'center'})}
  if(game.paused){R(0,0,VW,VH,'rgba(10,10,20,.6)');txt('SZÜNET',VW/2,104,{al:'center',sz:22,c:'#ffcd75'});txt('P / Esc: folytatás   M: zene ki/be',VW/2,134,{al:'center'})}
}

/* ---------- címképernyő (Amiga demó hangulat) ---------- */
const BARS=[['#5d275d','#b13e53','#ef7d57','#ffcd75','#ef7d57','#b13e53','#5d275d'],['#29366f','#3b5dc9','#41a6f6','#73eff7','#41a6f6','#3b5dc9','#29366f'],['#257179','#38b764','#a7f070','#f4f4f4','#a7f070','#38b764','#257179']];
const SCROLL='      ★ LOVAG & MASNI ★  Egy kétszemélyes kaland: a nagy páncélos lovag és a masnis cica egyetlen piros fonallal van összekötve...  Segítsetek egymásnak: horgonyozzatok, lengjetek, másszatok fel a fonalon!  ★ Zene igazi négycsatornás Amiga / C64 hangulatban ★  Jó szórakozást! ★      ';
const dK=mkP(KCFG),dC=mkP(CCFG);dK.onG=dC.onG=true;dC.face=-1;
function bgDemo(){R(0,0,VW,VH,'#0b0b18');
  for(let i=0;i<70;i++){const sp=.5+(i%3)*.6,x=Math.round(VW-((i*97+T*sp)%VW)),y=(i*53)%VH;R(x,y,i%3===2?2:1,1,i%3===0?'#f4f4f4':'#566c86')}
  for(let b=0;b<3;b++){const cy=Math.round(70+Math.sin(T*.03+b*2.1)*55);BARS[b].forEach((c,j)=>R(0,cy+j*2,VW,2,c))}}
function bigTitle(s,y,sz){ctx.font=`bold ${sz}px Impact,"Arial Black",sans-serif`;ctx.textBaseline='top';ctx.textAlign='left';
  const w=ctx.measureText(s).width;let x=(VW-w)/2;const cols=['#ffcd75','#ff77a8','#73eff7','#a7f070'];
  for(let i=0;i<s.length;i++){const ch=s[i],cw=ctx.measureText(ch).width,yy=y+Math.round(Math.sin(T*.08+i*.5)*4);
    ctx.lineWidth=4;ctx.strokeStyle='#1a1c2c';ctx.strokeText(ch,x,yy);ctx.fillStyle=cols[(i+(T>>4))%4];ctx.fillText(ch,x,yy);x+=cw}}
function scroller(y){ctx.font=`bold 10px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';const cw=7,off=(T*1.4)%(SCROLL.length*cw);
  for(let i=0;i<SCROLL.length;i++){const x=VW-off+i*cw;if(x<-8||x>VW)continue;const yy=y+Math.round(Math.sin(x*.04+T*.08)*6);
    ctx.fillStyle='#1a1c2c';ctx.fillText(SCROLL[i],x+1,yy+1);ctx.fillStyle=`hsl(${(x*1.2+T*3)%360},90%,70%)`;ctx.fillText(SCROLL[i],x,yy)}}
function drawTitle(){bgDemo();bigTitle('LOVAG & MASNI',14,40);txt('~ A fonal kalandja ~',VW/2,60,{al:'center',sz:11,c:'#ff77a8'});
  dK.anim=dC.anim=T;const gy=134;R(110,gy,260,2,'#566c86');
  ctx.save();ctx.translate(150,gy-56);ctx.scale(2,2);drawParts(knightParts(dK),0,0,14,1);ctx.restore();
  ctx.save();ctx.translate(300,gy-22+Math.round(Math.abs(Math.sin(T*.06))*-6));ctx.scale(2,2);drawParts(catParts(dC),0,0,12,-1);ctx.restore();
  drawRopeAt(156,gy-20,312,gy-26+Math.round(Math.abs(Math.sin(T*.06))*-6),190);
  drawMenu();
  const pads=getPads().length;
  txt('Lovag: A/D, W ugrás, S horgony, F kard  ·  Masni: nyilak, ↓ horgony, Enter miaú',VW/2,228,{al:'center',c:'#94b0c2',sz:7});
  if(isTouch&&innerHeight>innerWidth)txt('Fordítsd fekvőre a telefont!',VW/2,238,{al:'center',c:'#ffcd75'});else txt(pads?'🎮 '+pads+' kontroller csatlakozva – A ugrás, B horgony, X kard/miaú, Start szünet':'Xbox-kontroller: csatlakoztasd, és nyomj meg rajta egy gombot',VW/2,238,{al:'center',c:pads?'#a7f070':'#94b0c2',sz:7});
  scroller(250)}
function drawLobby(){bgDemo();
  if(game.state==='code'){bigTitle('SZOBAKÓD',14,32);txt('Írd be a társad telefonján látható 4 számjegyű kódot:',VW/2,58,{al:'center',c:'#ffcd75'});
    for(let i=0;i<4;i++){const x=VW/2-58+i*30;R(x,72,24,18,'rgba(26,28,44,.9)');R(x,89,24,1,'#ff77a8');if(game.codeIn[i])txt(game.codeIn[i],x+12,74,{al:'center',sz:14,c:'#f4f4f4'})}
    for(const r of kpRects()){const ok=r.k==='OK',dis=ok&&game.codeIn.length<4;R(r.x,r.y,r.w,r.h,ok?(dis?'rgba(86,108,134,.6)':'rgba(56,183,100,.9)'):'rgba(26,28,44,.9)');R(r.x,r.y,r.w,1,'#94b0c2');txt(r.k,r.x+r.w/2,r.y+6,{al:'center',sz:11,c:'#f4f4f4'})}}
  else if(game.state==='lobby'){bigTitle('SZOBA: '+roomCode,16,36);
    txt('Te leszel: '+(game.me===0?'a LOVAG':'MASNI'),VW/2,64,{al:'center',sz:11,c:game.me===0?'#73eff7':'#ff77a8'});
    txt('Várakozás a társra'+'.'.repeat(1+(T>>4)%3),VW/2,84,{al:'center',sz:12,c:'#ffcd75'});
    ['A másik telefonon nyisd meg ezt az oldalt,','válaszd: „Online: csatlakozás szobakóddal”, és írd be: '+roomCode,'– vagy küldd el neki a meghívó linket, az egyből a kódot hozza.'].forEach((l,i)=>txt(l,VW/2,110+i*12,{al:'center'}));
    txt(inviteURL(),VW/2,152,{al:'center',sz:7,c:'#94b0c2'});
    if(game.flashT>0){game.flashT--;txt(game.flash,VW/2,176,{al:'center',c:'#a7f070'})}}
  else if(game.state==='joining'){bigTitle('KAPCSOLÓDÁS…',40,32);txt('Szoba: '+(roomCode||''),VW/2,100,{al:'center',sz:12,c:'#ffcd75'});txt('Egy pillanat'+'.'.repeat(1+(T>>4)%3),VW/2,122,{al:'center'})}
  else if(game.state==='msg'){bigTitle('HOPPÁ',30,32);wrap(game.msg,380,10).forEach((l,i)=>txt(l,VW/2,100+i*13,{al:'center',sz:10,c:'#ffcd75'}))}
  drawMenu();scroller(250)}
function drawEnd(){bgDemo();bigTitle('GRATULÁLOK!',30,40);
  txt('A lovag és Masni végigjárta mind a 4 pályát, és megérkezett a hotelbe.',VW/2,88,{al:'center',sz:10});txt('A többi már magánügy. 😉 A fonal kitartott – együtt minden sikerül!',VW/2,102,{al:'center',sz:10,c:'#ff77a8'});
  dK.anim=dC.anim=T;ctx.save();ctx.translate(196,120);ctx.scale(2,2);drawParts(knightParts(dK),0,0,14,1);ctx.restore();
  ctx.save();ctx.translate(250,154-Math.round(Math.abs(Math.sin(T*.1))*12));ctx.scale(2,2);drawParts(catParts(dC),0,0,12,-1);ctx.restore();
  txt('Érmék: '+game.coins+'     Elesések: '+game.deaths,VW/2,190,{al:'center',sz:12,c:'#ffcd75'});
  if(game.endT>60&&(T>>5)%2===0)txt(isTouch?'Koppints az újrakezdéshez':'ENTER: újra a címképernyőre',VW/2,215,{al:'center',sz:10});scroller(250)}

/* ===================== FŐCIKLUS ===================== */
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();jp.clear();tapped=false;tapPos=null;acc-=1000/60}
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
  if(game.state==='title')drawTitle();else if(game.state==='end')drawEnd();else if(game.state==='play'&&LV)renderPlay();else drawLobby();
  requestAnimationFrame(frame)}
{const m=/^#(\d{4})$/.exec(location.hash);if(m){game.state='code';game.codeIn=m[1]}}
requestAnimationFrame(frame);
</script>
