<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Szökés a Varjúkő-kastélyból</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English+SC&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: spooky-cute family horror, a candlelit castle at night
   IDEA: a point-and-click escape room in a haunted castle
   PICTURE: each room is one illustrated SVG scene that is the playfield
   COLOUR and TYPE: deep plum-black stone, candle amber, blood red; Creepster titles, IM Fell for notes, Nunito for UI
   LAYOUT: scene on top, heroes + speech bubble + inventory below */
:root{color-scheme:dark;--bg:#0b080d;--ink:#efe6d8;--amber:#ffb340;--blood:#b3121b;--panel:#1a1320}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;user-select:none}
#game{max-width:1100px;margin:0 auto;padding:8px}
#sceneWrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px #3a2a40,0 10px 40px #000}
#scene{display:block;width:100%;height:auto;background:#000;touch-action:manipulation}
#roomTitle{position:absolute;left:14px;top:8px;font:28px Creepster,cursive;color:#d9c7ff;text-shadow:0 2px 6px #000;letter-spacing:1px;pointer-events:none}
#flash{position:absolute;inset:0;background:#dfe8ff;opacity:0;pointer-events:none}
#flash.on{animation:fl 1.1s}
@keyframes fl{0%{opacity:0}5%{opacity:.85}12%{opacity:.1}20%{opacity:.7}100%{opacity:0}}
#scene [data-hs]{cursor:pointer}
#scene [data-hs]:hover{filter:brightness(1.35)}
#hud{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;margin-top:10px;align-items:stretch}
#chars{display:flex;gap:6px;align-items:flex-end}
.av{width:72px;height:80px;transition:transform .2s}
.av.talk{animation:bob .45s infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-3deg)}}
#bubble{background:var(--panel);border:2px solid #4b3656;border-radius:14px;padding:10px 14px;min-height:80px;display:flex;flex-direction:column;justify-content:center}
#bubble b{color:var(--amber);font-weight:800}
#bubble.p b{color:#ffb6d9}#bubble.m b{color:#e0a96d}#bubble.n b{color:#b9a7d9}
#bottom{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
#inv{display:flex;gap:8px;flex:1;flex-wrap:wrap;min-height:64px;background:var(--panel);border-radius:12px;padding:6px;border:2px solid #33243b}
#inv:empty::before{content:"A zsebetek még üres…";color:#7d6c88;padding:14px}
.it{width:64px;height:52px;border-radius:10px;background:#2a1f31;border:2px solid #4b3656;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1}
.it small{font-size:11px;margin-top:3px;color:#cbb}
.it.sel{border-color:var(--amber);box-shadow:0 0 12px var(--amber);background:#3b2a1d}
.btn{font:800 15px Nunito;background:#3a2346;color:#fff;border:2px solid #6c4880;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:hover{background:#4c2d5c}.btn:focus-visible{outline:3px solid var(--amber)}
.btn.red{background:#6b0f16;border-color:#a3212b}
#modal,#jump,#start,#win{position:fixed;inset:0;display:none;z-index:20}
#modal{background:#000a;align-items:center;justify-content:center;padding:16px}
#modal.on,#start.on,#win.on{display:flex}
.box{background:#1c1422;border:3px solid #5a4068;border-radius:18px;padding:18px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 50px #000}
.box h3{font:30px Creepster,cursive;margin:0 0 10px;color:#e7d3ff;letter-spacing:1px}
.paper{background:linear-gradient(#e9dcbc,#d4c194);color:#3a2a14;font:22px/1.4 'IM Fell English SC',serif;padding:22px;border-radius:6px;transform:rotate(-1.5deg);box-shadow:inset 0 0 30px #8a6b3a}
.disp{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.disp span{width:46px;height:56px;border-radius:8px;background:#0b070d;border:2px solid #6b4d7a;font:800 30px/52px Nunito;color:#7cff9b;text-shadow:0 0 8px #3f6}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button,.wheel button{font:800 22px Nunito;min-height:54px;border-radius:10px;border:2px solid #5a4068;background:#2d2036;color:#fff;cursor:pointer}
.pad button:active,.wheel button:active{background:#4a3358}
.wheels{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.wheel{display:flex;flex-direction:column;gap:6px;align-items:center}
.wheel div{width:56px;height:64px;border-radius:10px;background:linear-gradient(#a07a2a,#e3c06a,#a07a2a);color:#2a1a05;font:800 34px/64px 'IM Fell English SC',serif}
.wheel button{width:56px;min-height:40px;font-size:18px}
.organ{display:flex;gap:6px;justify-content:center;margin:14px 0}
.organ button{width:62px;height:150px;border-radius:0 0 10px 10px;background:linear-gradient(#fffef6,#d8d2c0);border:2px solid #222;font:30px serif;color:#4a1010;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;cursor:pointer}
.organ button.dn{background:linear-gradient(#c9c2a8,#a9a28a);transform:translateY(4px)}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#jump{background:#000;align-items:center;justify-content:center}
#jump.on{display:flex;animation:jz .9s forwards}
#jump svg{width:min(95vw,95vh);height:auto;animation:jzs .9s}
@keyframes jz{0%{background:#000}10%{background:#5a0000}100%{background:#000}}
@keyframes jzs{0%{transform:scale(.3)}15%{transform:scale(1.15) rotate(3deg)}30%{transform:scale(1) rotate(-3deg)}45%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1.02)}}
#start,#win{background:radial-gradient(ellipse at 50% 30%,#2a1838,#07050a 70%);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;overflow:auto}
#start h1,#win h1{font:clamp(40px,8vw,78px)/1.05 Creepster,cursive;color:#e9d6ff;margin:8px 0;text-shadow:0 0 18px #8b3fd1,0 4px 0 #3b0f4f;letter-spacing:2px}
#start p,#win p{max-width:560px;color:#cdbfd8}
#start svg,#win svg{width:min(560px,92vw);height:auto}
#win{background:linear-gradient(#2b1d4a,#c2557a 55%,#ffb46b)}
#win h1{color:#fff4d6;text-shadow:0 4px 0 #6b2340}
/* scene animations */
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12) skewX(3deg)}}
.glow{animation:gl 2.5s infinite alternate}
@keyframes gl{from{opacity:.35}to{opacity:.6}}
.rain{animation:rain .5s linear infinite}
@keyframes rain{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.veins{opacity:0;transition:opacity .3s}.rolled .veins{opacity:1}
.bleed{stroke-dasharray:120;stroke-dashoffset:120;animation:bl 4s forwards}
@keyframes bl{to{stroke-dashoffset:0}}
.drop{animation:dr 1.6s infinite ease-in}
@keyframes dr{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(190px);opacity:0}}
.pool{transform-box:fill-box;transform-origin:center;animation:po 6s forwards}
@keyframes po{from{transform:scale(.2)}to{transform:scale(1)}}
.write{opacity:0;animation:wr 3s forwards}
@keyframes wr{to{opacity:1}}
.fall{animation:fa .6s cubic-bezier(.5,0,1,1)}
@keyframes fa{from{transform:translate(-30px,-380px) rotate(-60deg)}to{transform:none}}
.redeye{animation:re 1.4s infinite alternate}
@keyframes re{from{opacity:.3}to{opacity:1}}
.bat{animation:bat 9s linear infinite}
@keyframes bat{from{transform:translate(-120px,40px)}50%{transform:translate(300px,-20px)}to{transform:translate(720px,60px)}}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:wg .2s infinite alternate}
@keyframes wg{to{transform:scaleY(-.6)}}
.ghost{opacity:0;transition:opacity 1.5s}.ghost.on{opacity:.55}
.mirrorface{opacity:0}.mirrorface.on{animation:mf 1.6s}
@keyframes mf{0%,100%{opacity:0}20%,70%{opacity:.9}}
.gear{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){#hud{grid-template-columns:1fr}.av{width:56px;height:62px}#chars{justify-content:center}#roomTitle{font-size:20px}}
@media(prefers-reduced-motion:reduce){.fl,.rain,.bat,.wing,.glow{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
 <pattern id="stone" width="120" height="60" patternUnits="userSpaceOnUse">
  <rect width="120" height="60" fill="#2a2431"/>
  <rect x="4" y="4" width="52" height="22" fill="#302838"/><rect x="64" y="4" width="52" height="22" fill="#2d2634"/>
  <rect x="34" y="34" width="52" height="22" fill="#312a39"/><rect x="-26" y="34" width="52" height="22" fill="#2c2533"/><rect x="94" y="34" width="52" height="22" fill="#2c2533"/>
  <path d="M0 0H120M0 30H120M0 0V30M60 0V30M30 30V60M90 30V60" stroke="#17121b" stroke-width="3"/>
 </pattern>
 <pattern id="wood" width="160" height="26" patternUnits="userSpaceOnUse">
  <rect width="160" height="26" fill="#3b2518"/><path d="M0 25H160M80 0V25" stroke="#1d1009" stroke-width="2"/><path d="M10 9Q50 6 75 11M90 16Q130 13 150 18" stroke="#4a2f1f" stroke-width="2" fill="none"/>
 </pattern>
 <pattern id="panel" width="100" height="140" patternUnits="userSpaceOnUse">
  <rect width="100" height="140" fill="#2a1a14"/><rect x="10" y="10" width="80" height="120" rx="4" fill="#33201a" stroke="#1a0f0a" stroke-width="3"/>
 </pattern>
 <pattern id="checker" width="80" height="80" patternUnits="userSpaceOnUse">
  <rect width="80" height="80" fill="#1c1720"/><rect width="40" height="40" fill="#2e2735"/><rect x="40" y="40" width="40" height="40" fill="#2e2735"/>
 </pattern>
 <radialGradient id="flameG"><stop offset="0" stop-color="#fff6c0"/><stop offset=".5" stop-color="#ffb340"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#ffb340" stop-opacity=".55"/><stop offset="1" stop-color="#ffb340" stop-opacity="0"/></radialGradient>
 <radialGradient id="vig" cx="50%" cy="45%" r="70%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c46a"/><stop offset=".5" stop-color="#8a6420"/><stop offset="1" stop-color="#d7ab4b"/></linearGradient>
 <linearGradient id="canvasG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a1c"/><stop offset="1" stop-color="#0f0d08"/></linearGradient>
 <linearGradient id="nightG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a24"/><stop offset="1" stop-color="#1b2550"/></linearGradient>
 <linearGradient id="stoneStatue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e6a72"/><stop offset=".45" stop-color="#b5b0b8"/><stop offset="1" stop-color="#5a565e"/></linearGradient>
 <radialGradient id="spotG"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
</svg>

<div id="game">
 <div id="sceneWrap">
  <svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="Kastély szoba"></svg>
  <div id="roomTitle"></div>
  <div id="flash"></div>
 </div>
 <div id="hud">
  <div id="chars"></div>
  <div id="bubble" class="n"><div><b>Narrátor:</b> …</div></div>
 </div>
 <div id="bottom">
  <div id="inv"></div>
  <button class="btn" id="bHint">💡 Súgó</button>
  <button class="btn" id="bSound">🔊</button>
  <button class="btn red" id="bReset">↺</button>
 </div>
</div>
<div id="modal"></div>
<div id="jump"></div>
<div id="start"></div>
<div id="win"></div>

<script>
{
/* ================= ÁLLAPOT ================= */
const KEY='varjuko_v1';
const fresh=()=>({room:'hall',inv:[],sel:null,f:{},hint:{},el:0,mute:false});
let S=fresh();
const $=id=>document.getElementById(id);
const scene=$('scene');
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.room&&!d.f.won)return d}catch(e){}return null}
let playing=false;
setInterval(()=>{if(playing){S.el+=1000;if(S.el%10000===0)save()}},1000);

/* ================= HANG (WebAudio) ================= */
let A=null,master=null;
function initAudio(){
 if(A)return;
 try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=A.createGain();master.gain.value=S.mute?0:.9;master.connect(A.destination);
 drone();
}
const now=()=>A.currentTime;
function nbuf(d){const b=A.createBuffer(1,Math.max(1,A.sampleRate*d|0),A.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;return b}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+Math.max(.02,d))}
function filt(type,f,q,dest){const x=A.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;x.connect(dest||master);return x}
function noise(d,type,f,q,p,a,dec,t0,dest){if(!A)return;const t=t0||now(),s=A.createBufferSource();s.buffer=nbuf(d);const fl=filt(type,f,q,null);fl.disconnect();const g=A.createGain();s.connect(fl);fl.connect(g);g.connect(dest||master);env(g,t,a,p,dec);s.start(t);s.stop(t+d);return{s,fl,g}}
function tone(type,f0,f1,dur,p,a,dest,t0){if(!A)return;const t=t0||now(),o=A.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=A.createGain();o.connect(g);g.connect(dest||master);env(g,t,Math.min(a,dur*.5),p,dur-a);o.start(t);o.stop(t+dur+.05);return{o,g}}
const SFX={
 thunder(){if(!A)return;noise(4,'lowpass',320,0,.9,.02,3.6);noise(3,'lowpass',140,0,.7,.4,2.4,now()+.25)},
 creak(){if(!A)return;const bp=filt('bandpass',700,6);for(let i=0;i<18;i++)tone('sawtooth',80+i*3+Math.random()*8,null,.07,.12,.005,bp,now()+i*.075)},
 whisper(){if(!A)return;const pan=A.createStereoPanner?A.createStereoPanner():null;if(pan){pan.pan.value=Math.random()*1.6-.8;pan.connect(master)}
  const n=noise(2.6,'bandpass',2600,5,.35,.5,2,0,pan||master);const l=A.createOscillator(),lg=A.createGain();l.frequency.value=4+Math.random()*4;lg.gain.value=1100;l.connect(lg);lg.connect(n.fl.frequency);l.start();l.stop(now()+2.7)},
 scream(){if(!A)return;const bp=filt('bandpass',1500,1);[0,7].forEach(dt=>{const s=tone('sawtooth',650+dt*10,1350,1.4,.28,.03,bp);const l=A.createOscillator(),lg=A.createGain();l.frequency.value=9;lg.gain.value=70;l.connect(lg);lg.connect(s.o.frequency);l.start();l.stop(now()+1.5)});noise(1.3,'bandpass',3200,1,.25,.02,1.1)},
 laugh(q){if(!A)return;const bp=filt('bandpass',q?600:900,3);for(let i=0;i<6;i++)tone('square',300-i*18,190-i*12,.14,q?.05:.14,.01,bp,now()+i*.2)},
 heart(){if(!A)return;for(let k=0;k<3;k++){tone('sine',62,38,.25,.7,.01,null,now()+k*.9);tone('sine',58,36,.22,.5,.01,null,now()+k*.9+.26)}},
 slam(){noise(.7,'lowpass',260,0,1,.005,.6);tone('sine',75,32,.6,.9,.005)},
 thud(){noise(.4,'lowpass',400,0,.7,.005,.35);tone('sine',120,50,.3,.5,.005)},
 drip(){tone('sine',1500,450,.14,.18,.005)},
 organ(f){if(!A)return;const lp=filt('lowpass',2400);[[1,.22,'sine'],[2,.12,'sine'],[3,.06,'square'],[.5,.15,'sine'],[1.005,.12,'triangle']].forEach(([h,p,t])=>tone(t,f*h,null,1.7,p,.06,lp))},
 chime(){[523,659,784,1047].forEach((f,i)=>tone('triangle',f,null,.6,.2,.01,null,now()+i*.11))},
 wrong(){const lp=filt('lowpass',600);tone('sawtooth',110,null,.55,.22,.01,lp);tone('sawtooth',116.5,null,.55,.22,.01,lp)},
 pick(){tone('triangle',600,1300,.22,.25,.01)},
 unlock(){tone('square',1900,null,.05,.12,.003);tone('square',1250,null,.07,.12,.003,null,now()+.09);noise(.3,'highpass',2500,0,.2,.005,.2,now()+.12)},
 steps(){for(let i=0;i<5;i++)noise(.2,'lowpass',180,0,.6,.005,.16,now()+i*.5)},
 chatter(){for(let i=0;i<10;i++)noise(.03,'highpass',2600,0,.35,.002,.025,now()+i*.06)},
 bats(){for(let i=0;i<6;i++)tone('sine',3200+Math.random()*1200,2500,.05,.05,.005,null,now()+i*.09)},
 key(){tone('triangle',880+Math.random()*80,null,.09,.12,.005)}
};
function drone(){const lp=filt('lowpass',180);const g=A.createGain();g.gain.value=.05;lp.disconnect();lp.connect(g);g.connect(master);
 [55,55.4,82.6].forEach(f=>{const o=A.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start()});
 const l=A.createOscillator(),lg=A.createGain();l.frequency.value=.08;lg.gain.value=70;l.connect(lg);lg.connect(lp.frequency);l.start()}
function play(n,...a){if(A&&SFX[n])try{SFX[n](...a)}catch(e){}}

/* ================= SZEREPLŐK (saját figurák) ================= */
const PANDA=`<svg class="av" id="avP" viewBox="0 0 80 90"><ellipse cx="40" cy="80" rx="22" ry="10" fill="#000" opacity=".35"/>
<ellipse cx="40" cy="70" rx="20" ry="17" fill="#f6f4f0"/><ellipse cx="23" cy="68" rx="7" ry="10" fill="#1b1b1f"/><ellipse cx="57" cy="68" rx="7" ry="10" fill="#1b1b1f"/>
<circle cx="18" cy="16" r="10" fill="#1b1b1f"/><circle cx="62" cy="16" r="10" fill="#1b1b1f"/>
<ellipse cx="40" cy="36" rx="28" ry="25" fill="#fbfaf7"/>
<ellipse cx="29" cy="36" rx="8" ry="10" fill="#1b1b1f" transform="rotate(-25 29 36)"/><ellipse cx="51" cy="36" rx="8" ry="10" fill="#1b1b1f" transform="rotate(25 51 36)"/>
<circle cx="30" cy="35" r="3" fill="#fff"/><circle cx="50" cy="35" r="3" fill="#fff"/><circle cx="31" cy="34" r="1.2" fill="#1b1b1f"/><circle cx="49" cy="34" r="1.2" fill="#1b1b1f"/>
<ellipse cx="40" cy="45" rx="4" ry="3" fill="#1b1b1f"/><path d="M36 50Q40 54 44 50" stroke="#1b1b1f" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="22" cy="46" r="4" fill="#ff9fc2" opacity=".7"/><circle cx="58" cy="46" r="4" fill="#ff9fc2" opacity=".7"/>
<path d="M58 10l12-7 0 15zM58 10l-10-9 -1 15z" fill="#ff5fa2"/><circle cx="58" cy="10" r="4" fill="#ff86b8"/></svg>`;
const BEAR=`<svg class="av" id="avM" viewBox="0 0 80 90"><ellipse cx="40" cy="80" rx="24" ry="10" fill="#000" opacity=".35"/>
<ellipse cx="40" cy="70" rx="22" ry="18" fill="#8a5a33"/><ellipse cx="40" cy="73" rx="12" ry="11" fill="#c99b6d"/>
<circle cx="17" cy="15" r="10" fill="#8a5a33"/><circle cx="63" cy="15" r="10" fill="#8a5a33"/><circle cx="17" cy="15" r="5" fill="#c99b6d"/><circle cx="63" cy="15" r="5" fill="#c99b6d"/>
<ellipse cx="40" cy="36" rx="29" ry="26" fill="#9a6639"/><ellipse cx="40" cy="45" rx="13" ry="10" fill="#d9b38c"/>
<circle cx="29" cy="32" r="3.4" fill="#1b120c"/><circle cx="51" cy="32" r="3.4" fill="#1b120c"/><circle cx="30" cy="31" r="1.1" fill="#fff"/><circle cx="52" cy="31" r="1.1" fill="#fff"/>
<ellipse cx="40" cy="41" rx="5" ry="3.5" fill="#1b120c"/><path d="M35 48Q40 52 45 48" stroke="#1b120c" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M20 58Q40 66 60 58L58 64Q40 71 22 64Z" fill="#2f6fb0"/></svg>`;
$('chars').innerHTML=PANDA+BEAR;
const NAMES={p:'Hópihe',m:'Mogyi',n:'Narrátor'};
let talkT;
function say(who,text){
 const b=$('bubble');b.className=who;b.innerHTML=`<div><b>${NAMES[who]}:</b> ${text}</div>`;
 document.querySelectorAll('.av').forEach(a=>a.classList.remove('talk'));
 const av=who==='p'?$('avP'):who==='m'?$('avM'):null;
 if(av){av.classList.add('talk');clearTimeout(talkT);talkT=setTimeout(()=>av.classList.remove('talk'),1800)}
}

function toSvg(e){const p=scene.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=scene.getScreenCTM();return m?p.matrixTransform(m.inverse()):p}

 if(g.closest('.rolled')){dx=0;dy=-5.5}else{const ax=pt.x-ex,ay=pt.y-ey,d=Math.hypot(ax,ay)||1,m=Math.min(3.4,d/30);dx=ax/d*m;dy=ay/d*m*.7}
 pu.setAttribute('cx',ex+dx);pu.setAttribute('cy',ey+dy)})}

 const sp=b.querySelectorAll('.disp span'),show=()=>sp.forEach((s,i)=>s.textContent=v[i]||'');
 b.querySelector('[data-x]').onclick=closeModal;
 b.querySelectorAll('[data-k]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k;play('key');
  if(k==='⌫')v=v.slice(0,-1);else if(k==='OK'){if(v===ans){closeModal();play('unlock');setTimeout(()=>play('chime'),150);ok()}else{play('wrong');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');v='';say(Math.random()<.5?'p':'m',['Nem jó… valami nem stimmel.','Hibás kód! Hallottad ezt a nevetést?','Próbáljuk újra, gondolkodjunk!'][Math.random()*3|0]);if(Math.random()<.4)play('laugh',1)}}
  else if(v.length<len)v+=k;show()})}
function letterLock(title,ans,ok){const AB='AÁBCDEÉFGHIÍJKLMNOÓÖŐPQRSTUÚÜŰVWXYZ',st=[0,0,0,0];
 const b=modal(`<h3>${title}</h3><p style="margin:0;color:#bba">Négy betűs forgózár</p><div class="wheels">${st.map((_,i)=>`<div class="wheel"><button data-u="${i}">▲</button><div id="w${i}">A</div><button data-d="${i}">▼</button></div>`).join('')}</div><div class="row"><button class="btn" data-ok>Nyitás</button><button class="btn" data-x>Mégse</button></div>`);
 const upd=i=>b.querySelector('#w'+i).textContent=AB[st[i]];
 b.querySelectorAll('[data-u]').forEach(x=>x.onclick=()=>{const i=+x.dataset.u;st[i]=(st[i]+AB.length-1)%AB.length;upd(i);play('key')});

 b.querySelector('[data-ok]').onclick=()=>{if(st.map(i=>AB[i]).join('')===ans){closeModal();play('unlock');setTimeout(()=>play('chime'),150);ok()}else{play('wrong');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');say('p','Nem nyílik… Melyik betűk lehetnek?')}}}

 case'crypt':return!f.ironTaken?['cr1','Nézz be a koporsókba… egyikben üzenet van.','A koponyapolcon az egyik koponya szeme vörösen világít — kattints rá!']:['cr2','A rácsot egy nagy lakat zárja.','Válaszd ki a vaskulcsot, és kattints a rácsra.'];
 case'tower':return['tw1','Mikor állt meg az idő? Emlékezz az első szobára!','Az előcsarnok órája 9:40-kor állt meg → <b>0940</b>.']}}
